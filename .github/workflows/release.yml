# Cada push a main compila Mac + Windows y publica el release v<número de corrida>.
name: release
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            files: |
              mac.zip
              MonterreyCount.dmg
          - os: windows-latest
            files: |
              windows.zip
              MonterreyCount-Setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: echo "${{ github.run_number }}" > VERSION
        shell: bash
      - run: pyinstaller --noconfirm --windowed --name MonterreyCount --paths . --add-data "VERSION:." --add-data "models:models" monterrey_count/__main__.py
      - if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/MonterreyCount.app mac.zip
          mkdir dmg
          cp -R dist/MonterreyCount.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Monterrey Count" -srcfolder dmg -format UDZO MonterreyCount.dmg
      - if: runner.os == 'Windows'
        run: |
          Compress-Archive dist/MonterreyCount windows.zip
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue)) { choco install innosetup -y; $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6" }
          ISCC /DAppVersion=${{ github.run_number }} installer\windows.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "v${{ github.run_number }}" mac.zip windows.zip MonterreyCount-Setup.exe MonterreyCount.dmg --repo "${{ github.repository }}" --title "v${{ github.run_number }}" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
